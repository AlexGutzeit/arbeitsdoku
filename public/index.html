<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arbeitsdoku">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Arbeitsdokumentation</title>
  <link rel="stylesheet" href="/css/style.css?v=84">
</head>
<body>
  <div id="app"></div>
  <script src="/js/app.js?v=84"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        // Alle 60 Sekunden nach neuem Service Worker suchen
        setInterval(() => reg.update(), 60000);
      });
      // Bei neuem Service Worker automatisch neu laden
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) { refreshing = true; location.reload(); }
      });
    }
  </script>
</body>
</html>

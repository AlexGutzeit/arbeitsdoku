<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Zoom bewusst NICHT gesperrt: auf der Baustelle (Sonne, Lesebrille, Handschuhe) muss man aufziehen koennen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="{{themeColor}}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{appName}}">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="16x16" href="{{iconBase}}/icon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{iconBase}}/icon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{iconBase}}/icon-180x180.png">
  <meta name="msapplication-TileImage" content="{{iconBase}}/icon-144x144.png">
  <meta name="msapplication-TileColor" content="{{themeColor}}">
  <title>{{appName}}</title>
  <link rel="stylesheet" href="/css/style.css?v=296">
  <style>:root {
    --primary: {{themeColor}};
    --primary-hover: color-mix(in srgb, {{themeColor}} 78%, black);
    --primary-light: color-mix(in srgb, {{themeColor}} 14%, white);
    --brand-bg: {{bgColor}};
  }</style>
</head>
<body>
  <div id="app"></div>
  <script src="/js/app-1-core.js?v=296"></script>
  <script src="/js/app-2-auth-layout.js?v=296"></script>
  <script src="/js/app-3-dashboard.js?v=296"></script>
  <script src="/js/app-4-planning-tools.js?v=296"></script>
  <script src="/js/app-5-team.js?v=296"></script>
  <script src="/js/app-6-admin.js?v=296"></script>
  <script src="/js/app-7-stats-pdf.js?v=296"></script>
  <script src="/js/app-8-comm-init.js?v=296"></script>
  <script src="/js/sw-register.js?v=296"></script>
</body>
</html>

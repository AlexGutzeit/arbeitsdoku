<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Zoom bewusst NICHT gesperrt: auf der Baustelle (Sonne, Lesebrille, Handschuhe) muss man aufziehen koennen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="{{themeColor}}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{appName}}">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="16x16" href="{{iconBase}}/icon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{iconBase}}/icon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{iconBase}}/icon-180x180.png">
  <meta name="msapplication-TileImage" content="{{iconBase}}/icon-144x144.png">
  <meta name="msapplication-TileColor" content="{{themeColor}}">
  <title>{{appName}}</title>
  <link rel="stylesheet" href="/css/style.css?v=451">
  <style>:root {
    --primary: {{themeColor}};
    --primary-hover: color-mix(in srgb, {{themeColor}} 78%, black);
    --primary-light: color-mix(in srgb, {{themeColor}} 14%, white);
    --brand-bg: {{bgColor}};
  }</style>
</head>
<body>
  <div id="app"></div>
  <!-- Download-Baustein (R18): gemeinsam mit der Gästeseite, deshalb eine eigene Datei -->
  <script src="/js/datei-laden.js?v=451"></script>
  <script src="/js/app-1-core.js?v=451"></script>
  <!-- ArbZG/JArbSchG als eigene Datei: dieselben Regeln fuer das Eintragsformular UND die
       Uebersichten. Muss nach app-1-core stehen (nutzt calcActualHours). -->
  <script src="/js/arbeitszeitrecht.js?v=451"></script>
  <!-- Abwesenheitskalender als eigene Datei (wie arbeitszeitrecht.js): Matrix Mitarbeiter x
       Tage, Monat und Jahr aus derselben Funktion. Braucht app-1-core (esc, Tooltip). -->
  <script src="/js/abwesenheitskalender.js?v=451"></script>
  <script src="/js/app-2-auth-layout.js?v=451"></script>
  <script src="/js/app-3-dashboard.js?v=451"></script>
  <script src="/js/app-4-planning-tools.js?v=451"></script>
  <script src="/js/app-5-team.js?v=451"></script>
  <script src="/js/sicherung-krypto.js?v=451"></script>
  <script src="/js/app-6-admin.js?v=451"></script>
  <script src="/js/app-7-stats-pdf.js?v=451"></script>
  <script src="/js/scanner.js?v=451"></script>
  <!-- Notizen: Vorschau und gemeinsame Bearbeitung (Schreibfeld selbst kommt erst beim Öffnen). -->
  <script src="/js/notiz-sitzung.js?v=451"></script>
  <script src="/js/app-8-comm-init.js?v=451"></script>
  <!-- Verzeichnis-Pflege (Produkte, Kategorien, Grosshaendler). Eigene Datei, weil sie nur
       von wenigen ueberhaupt geoeffnet wird und app-8 sonst weiter aufliefe. -->
  <script src="/js/app-9-produkte.js?v=451"></script>
  <!-- Meldungen (Themen, Probleme melden, History). Eigene Datei wie app-9. -->
  <script src="/js/app-10-meldungen.js?v=451"></script>
  <!-- Kollegen (Verzeichnis, Personenseite, „Für die Kollegen" auf Mein Konto). -->
  <script src="/js/app-11-kollegen.js?v=451"></script>
  <script src="/js/sw-register.js?v=451"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5DB635">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SenTec">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <meta name="msapplication-TileImage" content="/icons/mstile-144x144.png">
  <meta name="msapplication-TileColor" content="#5DB635">
  <title>SenTec</title>
  <link rel="stylesheet" href="/css/style.css?v=143">
</head>
<body>
  <div id="app"></div>
  <script src="/js/app.js?v=143"></script>
  <script>
    if ('serviceWorker' in navigator) {
      function showUpdateBanner(reg) {
        if (document.getElementById('sw-update-banner')) return;
        const b = document.createElement('div');
        b.id = 'sw-update-banner';
        b.innerHTML = 'Neue Version verfügbar <button id="sw-update-btn">Jetzt aktualisieren</button>';
        document.body.appendChild(b);
        document.getElementById('sw-update-btn').addEventListener('click', () => {
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        });
      }

      navigator.serviceWorker.register('/sw.js').then(reg => {
        setInterval(() => reg.update(), 60000);
        // SW wartet bereits (z.B. Tab war beim letzten Update offen)
        if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg);
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(reg);
          });
        });
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        location.reload();
      });
    }
  </script>
</body>
</html>
